<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Steps</title>
<meta name="theme-color" content="#14222F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Code Steps">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one narrow phone-first column; lessons as a numbered path; a fixed answer dock at the bottom. Code blocks look like keycaps you tap into place. */
:root{
  --bg:#EAF0F5; --surface:#FFFFFF; --ink:#13202D; --muted:#56687A; --line:#CCD7E1;
  --accent:#2F5BD8; --accent-ink:#FFFFFF; --gold:#E9A800;
  --good:#17824F; --good-soft:#DDF3E7; --bad:#C23B2C; --bad-soft:#FBE3DF;
  --code-bg:#14222F; --code-fg:#E3ECF4; --code-kw:#8FB0FF; --code-bi:#FFCF4D; --code-str:#7FD8A6; --code-num:#FF9E80;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#18232E; --ink:#E5EDF4; --muted:#93A5B6; --line:#2C3B49;
  --accent:#6F8FFF; --accent-ink:#0B1220; --gold:#F5C542;
  --good:#45C783; --good-soft:#143326; --bad:#F2705F; --bad-soft:#3A1C18;
  --code-bg:#09111A; --code-fg:#E3ECF4; --code-kw:#9DB8FF; --code-bi:#FFD666; --code-str:#86E0AE; --code-num:#FFAA8C;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#18232E; --ink:#E5EDF4; --muted:#93A5B6; --line:#2C3B49;
  --accent:#6F8FFF; --accent-ink:#0B1220; --gold:#F5C542;
  --good:#45C783; --good-soft:#143326; --bad:#F2705F; --bad-soft:#3A1C18;
  --code-bg:#09111A; --code-fg:#E3ECF4; --code-kw:#9DB8FF; --code-bi:#FFD666; --code-str:#86E0AE; --code-num:#FFAA8C;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 140px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0}

/* Home */
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.5rem;letter-spacing:-.01em}
.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--code-bg);color:var(--code-bi);font-family:var(--f-code);font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-block:20px 28px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.stat.streak b{color:var(--gold)}
.eyebrow{font-family:var(--f-body);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}
.path{list-style:none;margin:0;padding:0;display:grid;gap:12px;position:relative}
.path::before{content:"";position:absolute;left:31px;top:24px;bottom:24px;width:3px;background:var(--line);border-radius:2px}
.node{position:relative;width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px 12px 10px}
.node:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.num{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--bg);border:3px solid var(--line);font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.node.next .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.node.done .num{background:var(--good);border-color:var(--good);color:#fff}
.txt{flex:1;min-width:0}
.txt b{display:block;font-family:var(--f-display);font-size:1.15rem}
.txt small{color:var(--muted);font-size:.9rem}
.tag{flex:none;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.node.next .tag{color:var(--accent)}
.node.done .tag{color:var(--good)}
.node:disabled{opacity:.55;cursor:default}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-top:18px}
.seg button{border:none;background:none;border-radius:9px;padding:10px;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.reset{margin-top:32px;background:none;border:none;color:var(--muted);font-size:.9rem;text-decoration:underline;padding:8px 0}
.reset.armed{color:var(--bad);font-weight:700}

/* Lesson */
.lbar{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.x{flex:none;width:44px;height:44px;border-radius:50%;border:none;background:none;font-size:1.8rem;line-height:1;color:var(--muted)}
.prog{flex:1;height:14px;border-radius:8px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:8px;transition:width .4s ease}
.kind{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0 0 6px}
.q{font-size:1.45rem;line-height:1.25;margin-bottom:18px}
pre.code{margin:0 0 20px;background:var(--code-bg);color:var(--code-fg);border-radius:12px;padding:16px;font-family:var(--f-code);font-size:1rem;line-height:1.7;overflow-x:auto;white-space:pre}
.tk{color:var(--code-kw);font-weight:700}.tb{color:var(--code-bi)}.ts{color:var(--code-str)}.tn{color:var(--code-num)}
.blank{display:inline-block;min-width:4.5ch;padding:0 8px;margin:2px 0;border:none;border-bottom:3px dashed var(--code-bi);border-radius:6px 6px 0 0;background:rgba(255,255,255,.08);font-family:var(--f-code);font-size:1rem;line-height:1.6;color:var(--code-bi);vertical-align:baseline}
.blank.filled{border-bottom-style:solid;background:rgba(255,207,77,.18)}
.opts{display:grid;gap:10px}
.tile{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:13px 14px;min-height:52px;font-size:1.05rem}
.tile:active{transform:translateY(2px);border-bottom-width:2px}
.tile.mono,.chip,.line{font-family:var(--f-code);font-size:1rem}
.tile.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:10px;padding:10px 16px;min-height:48px}
.chip:active{transform:translateY(2px);border-bottom-width:2px}
.chip.used,.line.used{visibility:hidden}
.tray{min-height:120px;border:2px dashed var(--line);border-radius:14px;padding:10px;display:grid;gap:8px;align-content:start;margin-bottom:18px}
.tray .hint{color:var(--muted);text-align:center;align-self:center;margin:28px 0;font-size:.95rem}
.pool{display:grid;gap:8px}
.line{width:100%;text-align:left;white-space:pre;overflow-x:auto;background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:10px;padding:11px 12px;min-height:48px}
.line:active{transform:translateY(2px);border-bottom-width:2px}
.tray .line{border-color:var(--accent)}
.locked .tile,.locked .chip,.locked .line,.locked .blank{pointer-events:none}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.dock.ok{background:var(--good-soft);border-top-color:var(--good)}
.dock.no{background:var(--bad-soft);border-top-color:var(--bad)}
.dock-in{max-width:528px;margin:0 auto;display:grid;gap:12px}
.verdict{font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.ok .verdict{color:var(--good)} .no .verdict{color:var(--bad)}
.why{margin:-6px 0 0;font-size:.98rem}
.btn{width:100%;border:none;border-radius:14px;padding:15px;font-weight:700;font-size:1.05rem;background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:default}
.ok .btn{background:var(--good);color:#fff} .no .btn{background:var(--bad);color:#fff}
.btn.ghost{background:none;color:var(--accent);box-shadow:none;border:1.5px solid var(--line)}

/* Finish */
.finish{text-align:center;padding-top:40px}
.finish .big{font-family:var(--f-code);font-size:3rem;color:var(--gold);margin-bottom:8px}
.finish h1{font-size:2rem;margin-bottom:8px}
.finish p{color:var(--muted);margin:0 0 24px}
.finish .stats{text-align:left}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* Code colors on light surfaces (answer tiles, blocks) */
:root{--hl-kw:#2F5BD8;--hl-bi:#8A5A00;--hl-str:#17824F;--hl-num:#B4432E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hl-kw:#8FB0FF;--hl-bi:#FFCF4D;--hl-str:#7FD8A6;--hl-num:#FF9E80}}
:root[data-theme="dark"]{--hl-kw:#8FB0FF;--hl-bi:#FFCF4D;--hl-str:#7FD8A6;--hl-num:#FF9E80}
.tile .tk,.line .tk,.chip .tk{color:var(--hl-kw)} .tile .tb,.line .tb,.chip .tb{color:var(--hl-bi)}
.tile .ts,.line .ts,.chip .ts{color:var(--hl-str)} .tile .tn,.line .tn,.chip .tn{color:var(--hl-num)}

#app.wide{max-width:1080px}

/* Top bar, sync, settings */
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.gear{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:1.3rem;color:var(--muted)}
.syncline{display:block;width:100%;text-align:left;margin-top:14px;padding:8px 12px;border-radius:10px;border:none;background:var(--surface);color:var(--muted);font-size:.88rem}
.syncline.good{color:var(--good)} .syncline.bad{color:var(--bad);background:var(--bad-soft)}
.back{border:none;background:none;color:var(--accent);font-weight:700;font-size:1rem;padding:10px 0}
.title{font-size:1.8rem;margin:8px 0 18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h2{font-size:1.15rem;margin-bottom:6px}
.panel p{margin:0 0 12px;color:var(--muted)}
.panel label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
.panel input{width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px}
.panel input:focus{outline:3px solid var(--accent);outline-offset:1px}
.panel .btn{margin-top:12px}
.panel .syncline{background:var(--bg);margin-top:14px}
.note{font-size:.9rem}
.linkbtn{border:none;background:none;color:var(--muted);text-decoration:underline;padding:8px 0;font-size:.9rem}
.linkbtn:disabled{opacity:.4;cursor:default}
.linkbtn.armed{color:var(--bad);font-weight:700}
.panel .reset{margin-top:0}

/* Home: playground entry */
.playcard{margin:-12px 0 28px}
.num.play{background:var(--code-bg);border-color:var(--code-bg);color:var(--code-bi);font-size:.9rem}
.playcard .tag{color:var(--accent)}

/* Console output */
.console{margin-top:16px;background:var(--code-bg);color:var(--code-fg);border-radius:12px;overflow:hidden}
.console-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--code-bi);border-bottom:1px solid rgba(255,255,255,.08)}
.console-h small{text-transform:none;letter-spacing:0;font-weight:400;color:#8FA3B5}
.console pre{margin:0;padding:12px 14px;font-family:var(--f-code);font-size:.95rem;line-height:1.6;white-space:pre-wrap;word-break:break-word;min-height:3.2em}
.console .muted{color:#8FA3B5;font-family:var(--f-body)}
.console .err{color:#FF8A7A;font-family:var(--f-body);font-weight:700}
.console .small{font-size:.8rem;font-family:var(--f-code);font-weight:400}
main.locked{padding-bottom:150px}
.dock .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid currentColor;box-shadow:none}

/* Learn steps */
.teach{margin:-6px 0 14px;font-size:1.05rem;max-width:65ch}
.touches{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:.95rem}
.fchip{font-family:var(--f-code);font-size:.85rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.learn-grid{display:grid;gap:14px}
.codebox{min-width:0}
.ftabs{display:flex;gap:4px;overflow-x:auto}
.ftabs button{flex:none;display:flex;align-items:center;gap:6px;border:none;border-radius:10px 10px 0 0;background:var(--line);color:var(--muted);font-family:var(--f-code);font-size:.85rem;padding:9px 12px;min-height:40px}
.ftabs button[aria-selected="true"]{background:var(--code-bg);color:var(--code-fg)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.code-h{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--code-bg);color:#8FA3B5;font-family:var(--f-code);font-size:.8rem;padding:9px 14px;border-radius:12px 12px 0 0;border-bottom:1px solid rgba(255,255,255,.08)}
.ftabs + .code-h{border-top-left-radius:0}
.newkey{order:2;display:flex;align-items:center;gap:6px;font-family:var(--f-body);color:var(--code-bi)}
.newkey::before{content:"";width:10px;height:10px;border-radius:2px;background:rgba(255,207,77,.35);box-shadow:inset 3px 0 0 var(--code-bi)}
pre.code.marked{margin:0;padding:10px 0;border-radius:0 0 12px 12px;max-height:340px;overflow:auto;position:relative}
.row{display:block;min-height:1.7em;padding:0 14px;white-space:pre}
.row.new{background:rgba(255,207,77,.16);box-shadow:inset 3px 0 0 var(--code-bi)}
.pagebox{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.page-h{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:.8rem;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
.page-h small{margin-left:auto;font-weight:400}
.dots{display:flex;gap:4px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
iframe.page{display:block;width:100%;height:300px;border:0;background:#FFFFFF}

/* Playground */
.play{display:grid;gap:18px;grid-template-areas:"prog" "out" "pal"}
.p-prog{grid-area:prog;min-width:0}.p-out{grid-area:out;min-width:0}.p-pal{grid-area:pal;min-width:0}
.p-out .console{margin-top:0}
.eyebrow small{margin-left:6px;font-weight:400;text-transform:none;letter-spacing:0}
.progbox{display:grid;gap:2px;align-content:start;min-height:130px;background:var(--code-bg);border-radius:12px;padding:8px}
.pline{text-align:left;border:none;background:none;border-radius:6px;color:var(--code-fg);font-family:var(--f-code);font-size:.95rem;padding:6px 8px;white-space:pre;overflow-x:auto}
.pline:hover{background:rgba(255,255,255,.07)}
.progbox .hint{color:#8FA3B5;text-align:center;margin:40px 0}
.ptools{display:flex;gap:18px}
.p-pal .chip{font-size:.92rem;padding:9px 12px}
.play{margin-top:20px}

@media (min-width:860px){
  .learn-grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
  pre.code.marked{max-height:480px}
  iframe.page{height:460px}
  .play{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"prog out" "pal out";align-items:start}
  .p-out{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
}
</style>
</head>
<body>
<div id="app"></div>
<script>

ge."}]}, {"id": "if", "title": "Decisions", "blurb": "Choose with if and else", "ex": [{"t": "mc", "q": "What is shown?", "code": "let x = 8;\nif (x > 5) {\n  console.log(\"big\");\n} else {\n  console.log(\"small\");\n}", "opts": ["big", "small", "big small"], "a": 0, "why": "8 is greater than 5, so only the if part runs."}, {"t": "fill", "q": "Check whether pet is equal to \"cat\".", "code": "if (pet [_] \"cat\") {\n  console.log(\"Meow\");\n}", "bank": ["=", "===", "=>"], "ans": ["==="], "why": "=== compares two values. A single = stores a value."}, {"t": "order", "q": "Build a program that shows \"Even\" for the number 4.", "lines": ["let n = 4;", "if (n % 2 === 0) {", "  console.log(\"Even\");", "}"], "why": "The condition goes in ( ), and the code it controls goes inside { }."}, {"t": "mc", "q": "What do the curly braces { } after an if do?", "opts": ["Hold the code that runs when the condition is true", "Make a comment", "End the program"], "a": 0, "why": "Braces group the lines that belong to the if."}]}, {"id": "loops", "title": "Loops", "blurb": "Repeat with for", "ex": [{"t": "mc", "q": "How many times does this show \"Go\"?", "code": "for (let i = 0; i < 3; i++) {\n  console.log(\"Go\");\n}", "opts": ["2", "3", "4"], "a": 1, "mono": true, "why": "i goes 0, 1, 2, then stops because 3 < 3 is false. That is three times."}, {"t": "fill", "q": "Count from 0 up to 2.", "code": "for (let i = 0; i [_] 3; i[_]) {\n  console.log(i);\n}", "bank": [">", "++", "<", "--"], "ans": ["<", "++"], "why": "Keep going while i < 3, and add 1 each time with i++."}, {"t": "order", "q": "Arrange the code so it adds 1 + 2 + 3 and shows 6.", "lines": ["let total = 0;", "for (const n of [1, 2, 3]) {", "  total = total + n;", "}", "console.log(total);"], "why": "Set the total before the loop, add inside it, show it after."}, {"t": "mc", "q": "What does i++ do?", "opts": ["Adds 1 to i", "Doubles i", "Sets i to 0"], "a": 0, "why": "++ is a shortcut for i = i + 1."}]}, {"id": "func", " const store = {

const KEY='code-steps-v1', LKEY='code-steps-lessons', YKEY='code-steps-sync';
const words = x => Array.isArray(x) ? x : String(x||'').split(/[|\s]+/).filter(Boolean);

const saved = store.get(LKEY);
// Courses from your Sheet replace built-in courses with the same ID; other built-in courses stay.
// Courses from your Sheet are combined with the built-in ones: a Sheet lesson replaces the built-in lesson with the same ID.
function mergeCourses(c){
  const out=JSON.parse(JSON.stringify(DEFAULT_COURSES));
  Object.keys(c||{}).forEach(k=>{
    const s=c[k], b=out[k];
    if(!s||!Array.isArray(s.lessons)) return;
    if(!b){ out[k]=s; return; }
    const lessons=b.lessons.map(l=>s.lessons.find(x=>x.id===l.id)||l);
    s.lessons.forEach(l=>{ if(!b.lessons.some(x=>x.id===l.id)) lessons.push(l); });
    out[k]=Object.assign({},b,{
      name:(s.name&&s.name!==k)?s.name:b.name,
      kw:words(s.kw).length?s.kw:b.kw, bi:words(s.bi).length?s.bi:b.bi,
      preview:s.preview||b.preview, lessons});
  });
  return out;
}

function liveStreak(){ const t=day(Date.now()), y=day(Date.now()-864e5); return (S.last===t||S.last===y)?S.streak:0; }
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const C=()=>COURSES[S.course], COURSE_L=()=>C().lessons, dk=l=>S.course+':'+l.id;
const reCache={};
function hlRe(spec,k){
  if(reCache[k]) return reCache[k];
  const kw=words(spec.kw).map(reEsc).join('|')||'(?!)', bi=words(spec.bi).map(reEsc).join('|')||'(?!)';
  return reCache[k]=new RegExp(`("[^"\\n]*"?|'[^'\\n]*'?)|\\b(${kw})\\b|\\b(${bi})\\b|(\\b\\d+(?:\\.\\d+)?\\b)`,'g');
}
function hl(s,spec,k){ if(!spec){spec=C();k=S.course;} const RE=hlRe(spec,k); RE.lastIndex=0; let out='',last=0,m;
  while((m=RE.exec(s))){ if(!m[0]){RE.lastIndex++;continue} out+=esc(s.slice(last,m.index)); const c=m[1]?'ts':m[2]?'tk':m[3]?'tb':'tn'; out+=`<span class="${c}">${esc(m[0])}</span>`; last=RE.lastIndex; }
  return out+esc(s.slice(last)); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
const unlocked=i=>i===0||!!S.done[dk(COURSE_L()[i-1])];
// ---------- running code ----------
// JavaScript runs for real in a throwaway worker (works offline). Endless loops are stopped after 1.5 s.
const WORKER_SRC=`const out=[];const fmt=v=>typeof v==='string'?v:v===undefined?'undefined':(v&&typeof v==='object')?(()=>{try{return JSON.stringify(v)}catch(e){return String(v)}})():String(v);
console.log=(...a)=>{if(out.length<200)out.push(a.map(fmt).join(' '))};
onmessage=e=>{try{(0,eval)(e.data);postMessage({out})}catch(err){postMessage({out,err:(err&&err.name?err.name+': '+err.message:String(err))})}};`;
let workerURL=null;
function runJS(code){
  return new Promise(res=>{
    let w;
    try{ workerURL=workerURL||URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'})); w=new Worker(workerURL); }
    catch(e){ res({out:[],err:'This browser cannot run code here.'}); return; }
    const t=setTimeout(()=>{w.terminate();res({out:[],err:'Stopped: the code kept running (an endless loop?)'})},1500);
    w.onmessage=e=>{clearTimeout(t);w.terminate();res(e.data)};
    w.onerror=e=>{e.preventDefault();clearTimeout(t);w.terminate();res({out:[],err:e.message||'Error'})};
    w.postMessage(code);
  });
}
const isJSCourse=()=>S.course==='js'||/javascript/i.test(C().name);
const isPageCourse=()=>C().preview==='page'||S.course==='web';

// Code with "+ " at the start of a line marks the lines that are new in this step.
const isNewLine=l=>l==='+'||l.startsWith('+ ');
const stripMarks=code=>code.split('\n').map(l=>isNewLine(l)?l.slice(2):l).join('\n');
function markedCode(code){
  return code.split('\n').map(l=>{ const n=isNewLine(l); const t=n?l.slice(2):l;
    return `<span class="row${n?' new':''}">${hl(t)||' '}</span>`; }).join('');
}
// A step can show several files. Each file starts with a line like:  === app.js
function parseFiles(code){
  const out=[]; let cur=null;
  String(code||'').split('\n').forEach(l=>{
    const m=/^===\s*(\S.*?)\s*=*\s*$/.exec(l);
    if(m){ cur={name:m[1],lines:[]}; out.push(cur); }
    else { if(!cur){ cur={name:'',lines:[]}; out.push(cur); } cur.lines.push(l); }
  });
  return out.map(f=>{ while(f.lines.length&&!f.lines[f.lines.length-1].trim()) f.lines.pop();
    const code=f.lines.join('\n'); return {name:f.name, code, changed:f.lines.some(isNewLine)}; })
    .filter(f=>f.name||f.code.trim());
}
const isPageFile=f=>(!f.name||/\.html?$/i.test(f.name))&&/<[a-z][\w-]*[\s>]/i.test(f.code);
// Builds one page from index.html + its .css and .js files, the way a browser would load them.
function buildPage(files){
  const html=files.find(isPageFile); if(!html) return '';
  let src=stripMarks(html.code);
  files.forEach(f=>{
    if(f===html||!f.name) return;
    const body=stripMarks(f.code), n=reEsc(f.name);
    if(/\.css$/i.test(f.name)){
      const re=new RegExp(`<link[^>]*href=["']${n}["'][^>]*>`,'i');
      src=re.test(src)?src.replace(re,()=>`<style>\n${body}\n</style>`):src.replace(/<\/head>|$/i,m=>`<style>\n${body}\n</style>${m}`);
    } else if(/\.js$/i.test(f.name)){
      const re=new RegExp(`<script[^>]*src=["']${n}["'][^>]*>\\s*<\\/script>`,'i');
      src=re.test(src)?src.replace(re,()=>`<script>\n${body}\n<\/script>`):src.replace(/<\/body>|$/i,m=>`<script>\n${body}\n<\/script>${m}`);
    }
  });
  return src;
}
function pageFrame(src){
  return `<div class="pagebox"><div class="page-h"><span class="dots"><i></i><i></i><i></i></span>What the page looks like<small>Try tapping it</small></div>
    <iframe class="page" sandbox="allow-scripts" title="Page preview" srcdoc="${esc(src)}"></iframe></div>`;
}
function friendlyErr(m){
  m=String(m); let r;
  if(/Unexpected end of input/.test(m)) return 'A { is missing its closing }. Add a } block.';
  if(/Unexpected token '}'/.test(m)) return 'There is a } with no { before it to close.';
  if(/Unexpected token 'else'/.test(m)) return 'else has to come right after the } of an if block.';
  if((r=/Identifier '(\w+)' has already been declared/.exec(m))) return `${r[1]} is created twice. Create it once, then change it with ${r[1]} = …`;
  if((r=/(\w+) is not defined/.exec(m))) return `${r[1]} is used before it is created.`;
  if(/Illegal return/.test(m)) return 'return only works inside a function.';
  return '';
}
function consoleHTML(r,friendly){
  if(!r) return '';
  let body;
  if(r.loading) body='<span class="muted">Running…</span>';
  else if(r.partial) body='<span class="muted">This code is only part of a program, so it can\'t run on its own.</span>';
  else {
    body=(r.out||[]).map(esc).join('\n');
    if(!body && !r.err) body='<span class="muted">The code ran but didn\'t print anything.</span>';
    if(r.err){ const f=friendly?friendlyErr(r.err):''; body+=(body?'\n':'')+`<span class="err">${esc(f||r.err)}</span>`+(f?`\n<span class="muted small">${esc(r.err)}</span>`:''); }
  }
  return `<section class="console" id="console" aria-live="polite"><div class="console-h"><span>Output</span>${r.stored?'<small>from the lesson</small>':''}</div><pre>${body}</pre></section>`;
}

function ago(t){ if(!t) return ''; const m=Math.round((Date.now()-t)/60000);
  if(m<1) return 'just now'; if(m<60) return m+' min ago'; const h=Math.round(m/60); if(h<24) return h+' hr ago';
  return new Date(t).toLocaleDateString(); }

// ---------- sync with the Apps Script sidekick ----------
function syncLine(){
  if(!sync.url) return {cls:'', text:'Using the built-in lessons. Connect your Sheet in Settings.'};
  if(sync.state==='syncing') return {cls:'', text:'Checking your Sheet for new lessons…'};
  if(!navigator.onLine) return {cls:'off', text:'Offline. Using saved lessons'+(sync.updated?' from '+ago(sync.updated):'')+'.'};
  if(sync.state==='error') return {cls:'bad', text:"Couldn't reach your Sheet ("+sync.error+"). Using saved lessons."};
  return {cls:'good', text:'Lessons up to date · synced '+ago(sync.updated)};
}
function applyCourses(c){
  COURSES=c; for(const k in reCache) delete reCache[k];
  if(!COURSES[S.course]) { S.course=Object.keys(COURSES)[0]; save(); }
}
async function pullLessons(){
  if(!sync.url || !navigator.onLine) { refresh(); return; }
  sync.state='syncing'; refresh();
  try{
    const r=await fetch(sync.url+(sync.url.includes('?')?'&':'?')+'api=lessons',{cache:'no-store'});
    const d=await r.json();
    if(!d.ok) throw new Error(d.error||'no lessons');
    if(!d.courses || !Object.keys(d.courses).length) throw new Error('the Sheet has no valid lessons');
    store.set(LKEY,{courses:d.courses, updated:d.updated});
    if(view==='lesson') waitingCourses=mergeCourses(d.courses); else applyCourses(mergeCourses(d.courses));
    sync.updated=Date.now(); sync.state='ok'; sync.error=''; sync.problems=(d.problems||[]).length;
  }catch(e){
    sync.state='error'; sync.error=e.message.includes('JSON')||e.message.includes('fetch')?'check the link':e.message;
  }
  saveSync(); refresh();
  pushProgress();
}
async function pushProgress(){
  if(!sync.url) return;
  if(!navigator.onLine){ sync.pending=true; saveSync(); return; }
  try{
    await fetch(sync.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'progress',device:sync.device,xp:S.xp,streak:liveStreak(),last:S.last,done:Object.keys(S.done)})});
    sync.pending=false;
  }catch(e){ sync.pending=true; }
  saveSync();
}
function refresh(){ if(view==='home'||view==='settings') render(); }
window.addEventListener('online', pullLessons);
window.addEventListener('offline', refresh);

function startLesson(i){
  const l=COURSE_L()[i];
  L={i,queue:l.ex.map((_,k)=>k),solved:0,total:l.ex.length,missed:new Set(),bonus:0};
  view='lesson';setupEx();render();window.scrollTo(0,0);
}
function cur(){ return COURSE_L()[L.i].ex[L.queue[0]]; }
function setupEx(){
  const e=cur(); L.sel=null; L.checked=false; L.run=null; L.ftab=null;
  if(e.t==='fill'){ L.tiles=shuffle(e.bank.map((_,k)=>k)); L.fills=e.ans.map(()=>null); }
  if(e.t==='order'){ let t,n=0; do{t=shuffle(e.lines.map((_,k)=>k))}while(n++<20&&t.every((v,k)=>e.lines[v]===e.lines[k])); L.tiles=t; L.placed=[]; }
}
function ready(){ const e=cur();
  if(e.t==='mc') return L.sel!==null;
  if(e.t==='fill') return L.fills.every(v=>v!==null);
  return L.placed.length===e.lines.length; }
function isRight(){ const e=cur();
  if(e.t==='mc') return L.sel===e.a;
  if(e.t==='fill') return L.fills.every((b,k)=>e.bank[b]===e.ans[k]);
  return L.placed.every((v,k)=>e.lines[v]===e.lines[k]); }

// The finished code of a practice exercise, with blanks filled in, so it can be run after answering.
function answerCode(e){
  if(e.t==='mc') return e.code||'';
  if(e.t==='fill'){ let i=0; return e.code.replace(/\[_\]/g,()=>e.ans[i++]||''); }
  if(e.t==='order') return e.lines.join('\n');
  return '';
}
const canRun=e=>e.t!=='learn' && !isPageCourse() && !!answerCode(e) && (isJSCourse()||!!e.out);

function lesson(){
  const e=cur(), pct=Math.round(L.solved/L.total*100);
  let kind, body='';
  const bar=`<div class="lbar"><button class="x" data-act="quit" aria-label="Leave lesson">×</button>
     <div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>`;
  if(e.t==='learn'){
    const files=parseFiles(e.code);
    if(L.ftab==null||L.ftab>=files.length){ const i=files.findIndex(f=>f.changed); L.ftab=i<0?0:i; }
    const f=files[L.ftab];
    const changed=files.filter(x=>x.changed&&x.name);
    const page=files.some(isPageFile)?buildPage(files):'';
    const tabs=files.length>1?`<div class="ftabs" role="tablist">${files.map((x,i)=>`<button role="tab" aria-selected="${i===L.ftab}" data-act="ftab" data-k="${i}">${esc(x.name||'code')}${x.changed?'<i class="dot" title="Changed in this step"></i>':''}</button>`).join('')}</div>`:'';
    app.innerHTML=`${bar}<main class="learn"><p class="kind">New idea</p><h2 class="q">${esc(e.q)}</h2>
      ${e.why?`<p class="teach">${esc(e.why)}</p>`:''}
      ${changed.length>1?`<p class="touches">This step changes <b>${changed.length} files</b>: ${changed.map(x=>`<span class="fchip">${esc(x.name)}</span>`).join(' ')}. They only work together.</p>`:''}
      <div class="learn-grid">
        ${f?`<div class="codebox">${tabs}<div class="code-h">${f.changed?'<span class="newkey">New lines</span>':''}${esc(f.name||'The code')}</div><pre class="code marked">${markedCode(f.code)}</pre></div>`:''}
        ${page?pageFrame(page):''}
        ${f&&!page&&e.out?consoleHTML({out:e.out.split('\n'),stored:true}):''}
      </div></main>
      <div class="dock"><div class="dock-in"><button class="btn" data-act="learned">Continue</button></div></div>`;
    const n=app.querySelector('.code .new'); if(n){ const pre=n.parentElement; pre.scrollTop=Math.max(0,n.offsetTop-pre.clientHeight/3); }
    return;
  }
  if(e.t==='mc'){
    kind='Choose the answer';
    if(e.code) body+=`<pre class="code">${hl(e.code)}</pre>`;
    body+=`<div class="opts">${e.opts.map((o,k)=>`<button class="tile ${e.mono?'mono':''} ${L.sel===k?'sel':''}" data-act="pick" data-k="${k}">${e.mono?hl(o):esc(o)}</button>`).join('')}</div>`;
  } else if(e.t==='fill'){
    kind='Fill the blank';
    const parts=e.code.split('[_]'); let html='';
    parts.forEach((p,k)=>{ html+=hl(p); if(k<parts.length-1){ const v=L.fills[k];
      html+=`<button class="blank ${v!==null?'filled':''}" data-act="unfill" data-k="${k}" aria-label="Blank ${k+1}">${v!==null?esc(e.bank[v]):'&nbsp;'}</button>`; } });
    body+=`<pre class="code">${html}</pre>`;
    body+=`<div class="bank">${L.tiles.map(b=>`<button class="chip ${L.fills.includes(b)?'used':''}" data-act="fill" data-k="${b}">${esc(e.bank[b])}</button>`).join('')}</div>`;
  } else {
    kind='Build the program';
    body+=`<div class="tray">${L.placed.length?L.placed.map((v,k)=>`<button class="line" data-act="unplace" data-k="${k}">${hl(e.lines[v])}</button>`).join(''):'<p class="hint">Tap the blocks below in the right order</p>'}</div>`;
    body+=`<div class="pool">${L.tiles.map(v=>`<button class="line ${L.placed.includes(v)?'used':''}" data-act="place" data-k="${v}">${hl(e.lines[v])}</button>`).join('')}</div>`;
  }
  let dock;
  if(!L.checked){
    dock=`<div class="dock"><div class="dock-in"><button class="btn" data-act="check" ${ready()?'':'disabled'}>Check</button></div></div>`;
  } else {
    const ok=lastResult;
    dock=`<div class="dock ${ok?'ok':'no'}" role="status"><div class="dock-in">
      <div class="verdict">${ok?'Correct!':'Not quite'}</div>
      <p class="why">${esc(e.why)}${ok?'':' This one will come back at the end.'}</p>
      ${canRun(e)&&!L.run?'<button class="btn ghost" data-act="run">▶ Run the code</button>':''}
      <button class="btn" data-act="next">Continue</button></div></div>`;
  }
  app.innerHTML=`${bar}
   <main class="${L.checked?'locked':''}${L.run?' with-console':''}"><p class="kind">${kind}</p><h2 class="q">${esc(e.q)}</h2>${body}${consoleHTML(L.run,false)}</main>${dock}`;
}
async function runLessonCode(){
  const e=cur(), code=answerCode(e), mine=L;
  if(!isJSCourse()){ L.run={out:e.out.split('\n'),stored:true}; render(); scrollConsole(); return; }
  L.run={loading:true}; render();
  const r=await runJS(code);
  if(L!==mine||view!=='lesson') return;
  if(r.err&&/ReferenceError/.test(r.err)&&!(r.out||[]).length) r.partial=true;
  L.run=r; render(); scrollConsole();
}
function scrollConsole(){ const c=document.getElementById('console'); if(c) c.scrollIntoView({block:'center',behavior:'smooth'}); }

function finishLesson(){
  const l=COURSE_L()[L.i], first=!S.done[dk(l)];
  const gained=(first?10:5)+L.bonus;
  S.done[dk(l)]=true; S.xp+=gained;
  const t=day(Date.now()), y=day(Date.now()-864e5);
  if(S.last!==t){ S.streak=(S.last===y?S.streak:0)+1; S.last=t; }
  save(); L.gained=gained; view='finish'; render(); window.scrollTo(0,0);
  pushProgress();
}
function finish(){
  const acc=Math.round((L.total-L.missed.size)/L.total*100), nxt=L.i+1<COURSE_L().length?L.i+1:null;
  app.innerHTML=`<div class="finish"><div class="big">+${L.gained} XP</div>
   <h1>${esc(COURSE_L()[L.i].title)} complete</h1>
   <p>${acc}% right on the first try</p>
   ${statsHTML()}
   <div class="dock-in">${nxt!==null?`<button class="btn" data-act="open" data-i="${nxt}">Next lesson: ${esc(COURSE_L()[nxt].title)}</button>`:`<p>You finished the whole ${esc(C().name)} course!</p>`}
   <button class="btn ghost" data-act="home">Back to lessons</button></div></div>`;
}

// ---------- playground ----------
// Each block is [what you see, what actually runs]. C# blocks run as their JavaScript twin.
const PALETTES={
  js:{name:'JavaScript', kw:'let const if else for function return', bi:'console log', blocks:[
    ['let x = 5;'],['let y = 3;'],['x = x + 1;'],['x = x * 2;'],['console.log(x);'],['console.log(x + y);'],['console.log("Hi!");'],
    ['if (x > 3) {'],['} else {'],['for (let i = 1; i <= 3; i++) {'],['console.log(i);'],
    ['function double(n) {'],['return n * 2;'],['console.log(double(x));'],['}']]},
  cs:{name:'C#', kw:'int static if else for return', bi:'Console WriteLine', blocks:[
    ['int x = 5;','let x = 5;'],['int y = 3;','let y = 3;'],['x = x + 1;'],['x = x * 2;'],
    ['Console.WriteLine(x);','console.log(x);'],['Console.WriteLine(x + y);','console.log(x + y);'],['Console.WriteLine("Hi!");','console.log("Hi!");'],
    ['if (x > 3) {'],['} else {'],['for (int i = 1; i <= 3; i++) {','for (let i = 1; i <= 3; i++) {'],['Console.WriteLine(i);','console.log(i);'],
    ['static int Double(int n) {','function Double(n) {'],['return n * 2;'],['Console.WriteLine(Double(x));','console.log(Double(x));'],['}']]}
};
const PKEY='code-steps-play';
let P=Object.assign({lang:'js', progs:{js:[0,2,4], cs:[0,2,4]}}, store.get(PKEY)||{}), PR=null, pclearArm=false;
const savePlay=()=>store.set(PKEY,{lang:P.lang,progs:P.progs});
function progLines(){
  const pal=PALETTES[P.lang]; let lvl=0;
  return (P.progs[P.lang]||[]).map(i=>{ const t=pal.blocks[i][0]; if(t.startsWith('}')) lvl=Math.max(0,lvl-1);
    const line={text:'  '.repeat(lvl)+t}; if(t.endsWith('{')) lvl++; return line; });
}
function playground(){
  const pal=PALETTES[P.lang], prog=P.progs[P.lang]||[], lines=progLines();
  app.innerHTML=`<header class="topline"><button class="back" data-act="home">‹ Lessons</button></header>
   <h1 class="title">Playground</h1>
   <div class="seg" role="tablist">${Object.entries(PALETTES).map(([k,p])=>`<button role="tab" aria-selected="${P.lang===k}" data-act="plang" data-c="${k}">${p.name}</button>`).join('')}</div>
   <div class="play">
     <section class="p-prog">
       <h2 class="eyebrow">Your program <small>tap a line to remove it</small></h2>
       <div class="progbox">${lines.length?lines.map((l,k)=>`<button class="pline" data-act="prem" data-k="${k}">${hl(l.text,pal,'play-'+P.lang)}</button>`).join(''):'<p class="hint">Tap blocks below to build a program</p>'}</div>
       <div class="ptools"><button class="linkbtn" data-act="pundo" ${prog.length?'':'disabled'}>Undo</button>
         <button class="linkbtn ${pclearArm?'armed':''}" data-act="pclear" ${prog.length?'':'disabled'}>${pclearArm?'Tap again to clear':'Clear all'}</button></div>
     </section>
     <section class="p-out">${PR?consoleHTML(PR,true):'<div class="console idle"><div class="console-h"><span>Output</span></div><pre><span class="muted">Tap Run to see what your program prints.</span></pre></div>'}</section>
     <section class="p-pal">
       <h2 class="eyebrow">Blocks</h2>
       <div class="bank">${pal.blocks.map((b,i)=>`<button class="chip" data-act="padd" data-k="${i}">${hl(b[0],pal,'play-'+P.lang)}</button>`).join('')}</div>
     </section>
   </div>
   <div class="dock"><div class="dock-in"><button class="btn" data-act="prun" ${prog.length?'':'disabled'}>▶ Run</button></div></div>`;
}
async function runPlayground(){
  const pal=PALETTES[P.lang], code=(P.progs[P.lang]||[]).map(i=>pal.blocks[i][1]||pal.blocks[i][0]).join('\n');
  PR={loading:true}; render();
  const r=await runJS(code); if(view!=='play') return;
  PR=r; render();
  if(window.innerWidth<860){ const c=document.getElementById('console'); if(c) c.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}

function render(){
  app.classList.toggle('wide', view==='play' || (view==='lesson' && L && cur().t==='learn'));
  if(view==='home') home(); else if(view==='settings') settings(); else if(view==='play') playground();
  else if(view==='lesson') lesson(); else finish();
}
function goHome(){
  view='home'; L=null;
  if(waitingCourses){ applyCourses(waitingCourses); waitingCourses=null; }
  render(); window.scrollTo(0,0);
}

app.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, k=+b.dataset.k;
  if(a!=='reset') resetArm=false;
  if(a!=='pclear') pclearArm=false;
  switch(a){
    case 'play': view='play'; render(); window.scrollTo(0,0); return;
    case 'plang': P.lang=b.dataset.c; PR=null; savePlay(); break;
    case 'padd': (P.progs[P.lang]=P.progs[P.lang]||[]).push(k); PR=null; savePlay(); break;
    case 'prem': P.progs[P.lang].splice(k,1); PR=null; savePlay(); break;
    case 'pundo': P.progs[P.lang].pop(); PR=null; savePlay(); break;
    case 'pclear': if(pclearArm){ P.progs[P.lang]=[]; PR=null; pclearArm=false; savePlay(); } else pclearArm=true; break;
    case 'prun': runPlayground(); return;
    case 'run': runLessonCode(); return;
    case 'ftab': L.ftab=k; break;
    case 'learned': { L.queue.shift(); L.solved++;
      if(!L.queue.length){ finishLesson(); return; }
      setupEx(); render(); window.scrollTo(0,0); return; }
    case 'open':
      if(waitingCourses){ applyCourses(waitingCourses); waitingCourses=null; }
      startLesson(+b.dataset.i); return;
    case 'home': case 'quit': goHome(); return;
    case 'settings': view='settings'; break;
    case 'course': S.course=b.dataset.c; save(); break;
    case 'saveurl': {
      const v=document.getElementById('syncUrl').value.trim();
      if(v && !/^https:\/\/script\.google(usercontent)?\.com\//.test(v)){ sync.state='error'; sync.error='that is not an Apps Script link'; sync.url=v; saveSync(); break; }
      sync.url=v; sync.state=''; saveSync(); pullLessons(); return; }
    case 'clearurl': sync.url=''; sync.state=''; saveSync(); store.set(LKEY,null); applyCourses(DEFAULT_COURSES); break;
    case 'reset': if(resetArm){ S=fresh(); save(); resetArm=false; pushProgress(); } else resetArm=true; break;
    case 'pick': L.sel=k; break;
    case 'fill': { const s=L.fills.indexOf(null); if(s>-1) L.fills[s]=k; break; }
    case 'unfill': L.fills[k]=null; break;
    case 'place': L.placed.push(k); break;
    case 'unplace': L.placed.splice(k,1); break;
    case 'check': { lastResult=isRight(); L.checked=true; const idx=L.queue[0];
      if(lastResult){ if(!L.missed.has(idx)) L.bonus+=2; } else L.missed.add(idx); break; }
    case 'next': { const idx=L.queue.shift();
      if(lastResult) L.solved++; else L.queue.push(idx);
      if(!L.queue.length){ finishLesson(); return; }
      setupEx(); render(); window.scrollTo(0,0); return; }
  }
  render();
});

render();
if(!PREVIEW){
  pullLessons();
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  }
}
</script>
</body>
